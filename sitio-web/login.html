<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión — Presente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="auth-logo" href="index.html">Presente<span>.</span></a>
    <div class="eyebrow">Acceso al registro</div>
    <h1>Inicia sesión para registrar tu asistencia</h1>
    <p class="auth-intro">Ingresa tus credenciales antes de acceder a la cámara y marcar tu asistencia.</p>

    <form id="loginForm" class="auth-form">
      <label for="email">Correo o usuario</label>
      <input type="text" id="email" autocomplete="username" placeholder="Ej. ana@ejemplo.com" required>

      <label for="password">Contraseña</label>
      <input type="password" id="password" autocomplete="current-password" placeholder="Escribe tu contraseña" required>

      <button type="submit" class="btn btn-primary btn-block">Iniciar sesión</button>
      <p id="loginMessage" class="auth-message" role="alert"></p>
    </form>

    <div class="demo-note">
      <strong>Acceso de demostración</strong>
      Usuario: <code>demo</code> · Contraseña: <code>presente123</code>
    </div>
    <a class="back-link" href="index.html">← Volver al inicio</a>
  </main>

<script>
const form = document.getElementById('loginForm');
const message = document.getElementById('loginMessage');

if (localStorage.getItem('presente:session')) {
  window.location.replace('app.html');
}

form.addEventListener('submit', (event) => {
  event.preventDefault();
  const username = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  if (username.toLowerCase() === 'demo' && password === 'presente123') {
    localStorage.setItem('presente:session', JSON.stringify({
      username: 'demo',
      loginAt: Date.now()
    }));
    window.location.replace('app.html');
    return;
  }

  message.textContent = 'Usuario o contraseña incorrectos. Revisa los datos e inténtalo nuevamente.';
});
</script>
</body>
</html>
